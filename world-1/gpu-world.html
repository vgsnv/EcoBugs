<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Жизнь на видеокарте в мире</title>
<style>
  body { margin: 0; background: #0e1114; color: #d8d6d0; font: 13px/1.4 system-ui, -apple-system, sans-serif; }
  .app { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; padding: 12px; }
  canvas { width: 100%; background: #000; border-radius: 6px; display: block; }
  .bar { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; flex-wrap: wrap; }
  button { font: inherit; height: 28px; border: 1px solid #3a4048; background: #1b2026; color: inherit; border-radius: 6px; padding: 0 10px; cursor: pointer; }
  aside { background: #151a1f; border: 1px solid #262c33; border-radius: 8px; padding: 10px 12px; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; font-size: 12px; margin-bottom: 4px; color: #9aa3ab; }
  .row b { color: #e8e6e0; font-weight: 500; font-variant-numeric: tabular-nums; }
  pre { font: 11px/1.35 ui-monospace, Menlo, monospace; white-space: pre-wrap; color: #9aa3ab; margin: 10px 0 0; max-height: 50vh; overflow: auto; }
  p { color: #8a929a; margin: 0 0 8px; font-size: 12px; }
</style>
</head>
<body>
<div class="app">
  <div>
    <div class="bar" id="bar"><button id="check">Проверить минерал</button></div>
    <canvas id="view"></canvas>
  </div>
  <aside>
    <p>Мир world-1 на CPU, жизнь на видеокарте. Параметры адреса: seed, cap (предел), speed, k (уплотнение), quanta (квантов на клетку при пределе).</p>
    <div id="summary"></div>
    <pre id="log"></pre>
  </aside>
</div>
<script type="module" src="/src/gpu-life/page.ts"></script>
</body>
</html>
