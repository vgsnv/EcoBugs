<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Песочница мира</title>
    <style>
      /*
       * Тема — светлая тёплая, «лабораторная»: тёплый серый фон под цвет коврика,
       * тонкие линии вместо рамок, моноширинные цифры, один тёплый акцент.
       * Раскладка одна: шапка в одну строку, под картой — минерал и ход мира, справа —
       * панель (уже 1000 px выезжает поверх карты). Окно уже 920 px не поддерживается —
       * страница прокручивается по горизонтали.
       */
      :root {
        color-scheme: light;
        --bg: #e9e7e1; --panel: #f7f6f2; --raised: #fffefb; --line: #d8d4ca; --line-strong: #c4bfb2;
        --text: #2a2925; --muted: #76716a; --faint: #a39e94;
        --accent: #a8572b; --accent-soft: #f2e2d5; --accent-line: #d9a888;
        --hover: #efece5; --press: #e6e1d7; --danger: #b3261e;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --h: 30px; --radius: 6px;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; overflow-y: hidden; }
      html { overflow-x: auto; }
      body { overflow-x: visible; }

      /* ── Раскладка ─────────────────────────────────────────────── */
      .app { height: 100%; min-width: 920px; display: flex; flex-direction: column; }
      .app:fullscreen { background: var(--bg); }
      .app-body { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 340px; flex: 1; min-height: 0; gap: 8px; padding: 0 8px 8px; }
      .app.sidebar-collapsed .app-body { grid-template-columns: minmax(0, 1fr) 40px; }
      .map-column { display: flex; flex-direction: column; min-width: 0; min-height: 0; gap: 6px; }
      .workspace { display: flex; flex: 1; min-height: 0; }
      .field { flex: 1; min-width: 0; min-height: 0; display: flex; }
      .stage { position: relative; width: 100%; height: 100%; min-height: 0; overflow: hidden; border-radius: 8px; background: #dfe3df; box-shadow: inset 0 0 0 1px #0000000f; }
      canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
      #world { position: relative; }
      canvas.field-gl { position: absolute; pointer-events: none; }
      .stage.dragging canvas { cursor: grabbing; }
      .stage.rulers-on { padding-left: 28px; padding-bottom: 24px; }
      canvas.ruler { position: absolute; pointer-events: none; cursor: default; }
      canvas.ruler-x { left: 28px; bottom: 0; width: calc(100% - 28px); height: 24px; }
      canvas.ruler-y { left: 0; top: 0; width: 28px; height: calc(100% - 24px); }
      .world-footer { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
      .world-playback { display: flex; align-items: center; gap: 10px; height: 46px; }
      .control-staging { display: none; }
      .spacer { flex: 1; }

      /* Правая панель: содержимое вкладки и полоса значков справа; свёрнутая — только полоса.
         На узком окне содержимое выезжает поверх карты, полоса остаётся у края. */
      .right-panel { display: grid; grid-template-columns: minmax(0, 1fr) 40px; min-height: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); overflow: hidden; }
      .app.sidebar-collapsed .right-panel { grid-template-columns: 40px; }
      .app.sidebar-collapsed .panel-content { display: none; }
      .panel-content { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow-y: auto; border-right: 1px solid var(--line); }
      .pane-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
      .pane-title { margin: 0; font-size: 13px; font-weight: 600; }
      .panel-tabs { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; }
      .panel-tab { position: relative; width: 30px; padding: 0; border-color: transparent; }
      .panel-tab[aria-selected=true] { color: var(--accent); }
      .panel-tab.active { background: var(--accent-soft); border-color: var(--accent-line); }
      .panel-tab.draft::after { content: ''; position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
      .right-panel .legend-head, .right-panel .params-head { display: none; }
      @media (max-width: 999px) {
        .app-body, .app.sidebar-collapsed .app-body { grid-template-columns: minmax(0, 1fr) 40px; }
        .right-panel { position: absolute; z-index: 6; top: 0; right: 8px; bottom: 84px; width: min(360px, calc(100% - 16px)); box-shadow: 0 10px 32px #2a29253d; }
        .app.sidebar-collapsed .right-panel { width: 40px; box-shadow: none; }
      }

      /* ── Кнопки и поля ─────────────────────────────────────────── */
      button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: var(--h); min-height: var(--h); padding: 0 10px; background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer; white-space: nowrap; font: inherit; font-size: 12.5px; transition: background-color 100ms, border-color 100ms, color 100ms; }
      button:hover:not(:disabled) { background: var(--hover); border-color: var(--line-strong); }
      button:active:not(:disabled) { background: var(--press); }
      button:disabled { color: var(--faint); border-color: var(--line); cursor: default; }
      button[aria-pressed=true], button[aria-expanded=true], button.active { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
      button.primary:hover:not(:disabled) { background: #93491f; border-color: #93491f; }
      button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      button svg, summary svg { display: block; width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .focus-toggle, .minimap-toggle, .legend-toggle, .run-toggle { width: var(--h); padding: 0; flex-shrink: 0; }
      .focus-toggle .focus-exit, .focus-toggle[aria-pressed=true] .focus-enter { display: none; }
      .focus-toggle[aria-pressed=true] .focus-exit { display: block; }
      .group { display: inline-flex; }
      .group button { border-radius: 0; margin-left: -1px; }
      .group button:first-child { border-radius: var(--radius) 0 0 var(--radius); margin-left: 0; }
      .group button:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
      .group button:hover:not(:disabled) { position: relative; }
      .zoom { min-width: 76px; font-family: var(--mono); font-size: 11.5px; }
      input[type=number], select { height: 28px; background: var(--raised); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; width: 100%; font: inherit; }
      input[type=range] { width: 100%; margin: 0; accent-color: var(--accent); }
      details { border-bottom: 1px solid var(--line); padding: 6px 0 10px; }
      details:last-child { border-bottom: 0; }
      summary { cursor: pointer; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 4px 0; user-select: none; }
      details[open] summary { margin-bottom: 4px; }

      /* ── Шапка: одна строка ────────────────────────────────────── */
      #toolbar { position: relative; z-index: 7; display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; height: 44px; padding: 0 8px; flex-shrink: 0; white-space: nowrap; }
      #toolbar > *, #view-controls > * { flex-shrink: 0; }
      #view-controls { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; min-width: 0; }
      .desktop-panel-label, .desktop-menu-note { display: none; }
      .file-menu, .view-menu { position: relative; padding: 0; border: 0; }
      .file-menu > summary, .view-menu > summary { display: flex; align-items: center; gap: 6px; height: var(--h); padding: 0 10px; margin: 0; border: 1px solid var(--line); border-radius: var(--radius); color: var(--text); font-size: 12.5px; font-weight: 500; text-transform: none; letter-spacing: 0; list-style: none; }
      .file-menu > summary::-webkit-details-marker, .view-menu > summary::-webkit-details-marker { display: none; }
      .file-menu > summary:hover, .view-menu > summary:hover { background: var(--hover); }
      .file-menu[open] > summary, .view-menu[open] > summary { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); margin: 0; }
      .menu-chevron { color: var(--muted); }
      .file-menu:not([open]) .menu-actions, .view-menu:not([open]) .menu-actions { display: none; }
      .menu-actions { position: absolute; top: calc(100% + 4px); left: 0; z-index: 8; display: flex; flex-direction: column; align-items: stretch; gap: 2px; min-width: 200px; padding: 4px; border: 1px solid var(--line); border-radius: 8px; background: var(--raised); box-shadow: 0 10px 28px #2a292529; }
      .menu-actions button { justify-content: flex-start; height: auto; min-height: var(--h); padding: 6px 8px; border-color: transparent; text-align: left; white-space: normal; flex-direction: column; align-items: flex-start; gap: 1px; }
      .menu-actions .desktop-menu-note { display: block; color: var(--muted); font-size: 11px; }
      .view-menu .menu-actions .process-control { display: flex; flex-direction: column; align-items: stretch; }
      .view-menu .process-legend { position: static; box-shadow: none; border: 0; padding: 4px 8px; }

      /* Время мира и скорость счёта. */
      .time-controls { display: flex; align-items: center; gap: 6px; }
      .time { display: grid; grid-template-columns: auto auto; align-items: baseline; gap: 0 10px; height: var(--h); padding: 0 10px; border-color: var(--line); background: var(--raised); text-align: left; }
      .world-age { font: 600 12.5px var(--mono); color: var(--text); }
      .world-rate, .actual-rate { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
      .actual-rate { display: inline-block; min-width: 15ch; }
      .world-rate { display: none; }
      .actual-rate[data-limited=true] { color: #9a6200; }
      .desktop-control-label { display: inline; }
      @media (max-width: 1100px) { .actual-rate { display: none; } }

      /* Под картой: запуск, скорость, на весь экран. */
      .run-toggle { width: 88px; padding: 0 10px; gap: 6px; background: var(--raised); }
      .run-toggle[data-state=running] { background: var(--text); border-color: var(--text); color: var(--panel); }
      .run-toggle[data-state=running]:hover:not(:disabled) { background: #43413b; border-color: #43413b; }
      .run-toggle svg { fill: currentColor; stroke: none; width: 14px; height: 14px; }
      .run-toggle .pause-icon, .run-toggle[data-state=running] .play-icon { display: none; }
      .run-toggle[data-state=running] .pause-icon { display: block; }
      .speed-control { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
      .speed-head { display: flex; align-items: center; justify-content: space-between; height: 14px; font-size: 11px; color: var(--muted); }
      .speed-value { font: 600 12px var(--mono); color: var(--accent); }
      input.speed-slider { display: block; width: 100%; height: 14px; margin: 0; padding: 0; appearance: none; -webkit-appearance: none; background: transparent; cursor: pointer; touch-action: pan-y; }
      .speed-slider::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: linear-gradient(to right, var(--accent) var(--speed-progress, 0%), var(--line-strong) var(--speed-progress, 0%)); }
      .speed-slider::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 13px; height: 13px; margin-top: -5px; background: var(--raised); border: 2px solid var(--accent); border-radius: 50%; }
      .speed-slider::-moz-range-track { height: 3px; border-radius: 2px; background: var(--line-strong); }
      .speed-slider::-moz-range-progress { height: 3px; background: var(--accent); }
      .speed-slider::-moz-range-thumb { width: 9px; height: 9px; background: var(--raised); border: 2px solid var(--accent); border-radius: 50%; }
      .speed-ticks { position: relative; display: block; height: 14px; margin: 0 6px; }
      .speed-ticks button { position: absolute; top: 0; transform: translateX(-50%); height: 14px; min-height: 0; padding: 0 3px; border: 0; background: transparent; color: var(--faint); font: 10px var(--mono); }
      .speed-ticks button:first-child { transform: none; padding-left: 0; }
      .speed-ticks button:last-child { transform: translateX(-100%); padding-right: 0; }
      .speed-ticks button[aria-pressed=true] { color: var(--accent); background: transparent; }
      .status { font-size: 12px; color: var(--muted); padding: 0 10px 6px; flex-shrink: 0; }
      .status:empty { display: none; }
      .status.error { color: var(--danger); }

      /* Процессы: легенда — под кнопкой. */
      .process-control { position: relative; display: inline-flex; }
      .process-legend { position: absolute; top: calc(100% + 4px); left: 0; z-index: 8; display: flex; flex-wrap: wrap; gap: 4px 12px; width: max-content; max-width: 320px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--raised); box-shadow: 0 10px 28px #2a292529; font-size: 11px; }
      .process-legend span { color: var(--text); }
      .process-legend i { font-style: normal; font-weight: 700; margin-right: 4px; }

      /* ── Полоса минерала ───────────────────────────────────────── */
      .mineral-stats { position: relative; z-index: 4; margin: 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; user-select: none; }
      .mineral-stats b { color: #7a4cb6; font-weight: 600; }
      .mineral-details { position: relative; padding: 0; border: 0; }
      .mineral-details > summary { display: flex; padding: 0; margin: 0; list-style: none; text-transform: none; letter-spacing: 0; }
      .mineral-details > summary::-webkit-details-marker, .mineral-details > summary > b { display: none; }
      .mineral-details[open] > summary { margin: 0; }
      .mineral-scale { position: relative; display: flex; flex-direction: column; flex: 1; min-width: 0; }
      .mineral-bar { position: relative; display: block; width: 100%; height: 18px; border-radius: 5px; background: #ece6f2; overflow: hidden; cursor: pointer; }
      .mineral-bar i { position: absolute; top: 0; bottom: 0; transition: left .25s linear, width .25s linear; }
      .mineral-ticks { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); align-items: center; padding: 0 8px; font: 10px var(--mono); color: #fff; text-shadow: 0 1px 2px #241334; pointer-events: none; white-space: nowrap; }
      .mineral-ticks > :first-child { text-align: left; }
      .mineral-ticks > :nth-child(2) { text-align: center; }
      .mineral-ticks > :last-child { text-align: right; }
      .mineral-keys { position: absolute; bottom: calc(100% + 6px); left: 0; right: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 14px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--raised); box-shadow: 0 10px 28px #2a292529; }
      .mineral-keys .volcanoes { margin-left: auto; }
      .mineral-stats .depths { background: #3d2a5c; }
      .mineral-stats .out { background: #e2c8ff; animation: mineral-out .8s ease-in-out infinite alternate; }
      .mineral-stats .medium { background: #b783f5; }
      .mineral-stats .deposits { background-color: #6a3fa6; background-image: radial-gradient(circle at 2px 2px, rgba(255, 240, 255, .85) .9px, transparent 1.4px), repeating-linear-gradient(135deg, rgba(30, 10, 60, .45) 0 2px, transparent 2px 5px); background-size: 6px 6px, auto; }
      .mineral-bar .threshold { width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 0 1px #d23c7a; }
      @keyframes mineral-out { from { opacity: 1; } to { opacity: .45; } }
      .key { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
      .key i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; }

      /* ── Панель: секции ────────────────────────────────────────── */
      #observation { display: flex; flex-direction: column; min-height: 0; }
      #world-summary { font-variant-numeric: tabular-nums; }
      .summary-section { padding: 10px 12px; border-bottom: 1px solid var(--line); }
      .summary-section:last-child { border-bottom: 0; }
      .summary-section h3 { margin: 0 0 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
      .summary-section dl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; margin: 0; font-size: 12px; }
      .summary-section dt { color: var(--muted); }
      .summary-section dd { margin: 0; text-align: right; font-family: var(--mono); font-size: 11.5px; }
      .summary-note { margin: 0; padding: 10px 12px; color: var(--muted); font-size: 11px; line-height: 1.5; }
      .light-drift { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--muted); user-select: none; }
      .sun-rhythm { color: #9a6200; font-family: var(--mono); font-size: 11.5px; }
      .light-speed { font-family: var(--mono); font-size: 11.5px; }

      /* Легенда. */
      #legend { flex: 1; min-height: 0; display: flex; flex-direction: column; font-size: 12px; }
      .legend-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; }
      .legend-body { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 8px 10px; display: flex; flex-direction: column; gap: 12px; }
      .legend-section h3 { margin: 0 0 4px; padding: 0 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
      .legend-items { display: grid; grid-template-columns: 1fr; gap: 1px; }
      button.legend-item { justify-content: flex-start; gap: 10px; height: auto; min-height: 30px; padding: 3px 6px; border: 0; text-align: left; white-space: normal; font-size: 12px; }
      button.legend-item[aria-pressed=true] { background: var(--accent-soft); color: var(--accent); }
      .swatch { display: flex; flex-shrink: 0; align-items: center; justify-content: center; width: 24px; height: 22px; border-radius: 4px; font-size: 20px; line-height: 1; }
      .legend-item svg { width: 24px; height: 20px; }
      .legend-detail { flex-shrink: 0; max-height: 125px; overflow-y: auto; margin: 0 8px 8px; padding: 10px; border-radius: 6px; color: var(--muted); line-height: 1.5; background: var(--hover); }
      .legend-detail strong { color: var(--text); font-weight: 600; }
      .legend-detail p { margin: 4px 0 0; }

      /* Миникарта в углу карты: в покое — контур, под курсором — картинка. */
      .minimap-overlay { position: absolute; z-index: 4; border-radius: 6px; transition: left .35s ease, top .35s ease, width .18s ease, height .18s ease, background-color .18s, box-shadow .18s; }
      .minimap-overlay.instant { transition: none; }
      .minimap-overlay.full { background: #f4f2ecee; box-shadow: 0 4px 16px #2a292540, inset 0 0 0 1px var(--line); }
      .minimap-overlay .minimap { width: 100%; height: 100%; cursor: pointer; }
      .minimap-hide { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; min-height: 20px; padding: 0; font-size: 14px; line-height: 1; color: var(--muted); background: var(--panel); opacity: 0; pointer-events: none; transition: opacity .15s; }
      .minimap-overlay.full .minimap-hide { opacity: 1; pointer-events: auto; }

      /* Точка на карте. */
      .probe-content { display: block; }
      .probe-actions { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 8px 12px 0; }
      .probe-actions button { height: 26px; min-height: 26px; font-size: 11.5px; }
      .probe-pin-note { display: block; padding: 6px 12px 0; color: var(--muted); font-size: 11px; }
      .tip { padding: 8px 12px 10px; font-size: 12px; line-height: 1.55; font-variant-numeric: tabular-nums; }
      .tip b { font-weight: 600; }

      /* Параметры нового мира. */
      #params { display: flex; flex-direction: column; min-height: 0; }
      .params-body { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 2px; }
      .params-foot { position: sticky; bottom: 0; border-top: 1px solid var(--line); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; background: var(--panel); }
      .fields { display: flex; flex-direction: column; gap: 10px; }
      label { display: flex; flex-direction: column; gap: 3px; }
      .row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
      .row.end { justify-content: flex-end; }
      .info { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--line-strong); color: var(--muted); font-size: 10px; cursor: help; margin-left: 4px; }
      .info:hover, .info:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
      .info-tip { position: fixed; z-index: 20; max-width: 260px; padding: 6px 9px; background: var(--text); color: var(--panel); border-radius: 6px; font-size: 12px; line-height: 1.4; pointer-events: none; box-shadow: 0 4px 12px #2a292540; }
      .value { color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
      .changed .value { color: var(--accent); font-weight: 600; }
      .layout { display: flex; flex-direction: column; gap: 4px; }
      .layout svg { width: 100%; max-width: 200px; max-height: 180px; height: auto; align-self: center; }
      .layout .dish { fill: #6c8ea3; stroke: #c9d6dc; stroke-width: 3; }
      .layout .wall { fill: none; stroke: #eef3f4; stroke-width: 3; stroke-linecap: square; stroke-linejoin: miter; }
      .note { color: var(--muted); font-size: 12px; }
      .note:empty, .errors:empty { display: none; }
      .errors { color: var(--danger); font-size: 12px; }
      /* Диапазон «от–до»: два бегунка на одной дорожке, ловят только бегунки. */
      .dual { position: relative; height: 18px; display: block; }
      .dual input { position: absolute; inset: 0; pointer-events: none; background: none; }
      .dual input::-webkit-slider-thumb { pointer-events: auto; }
      .dual input::-moz-range-thumb { pointer-events: auto; }
      .dual input + input::-webkit-slider-runnable-track { background: none; }
      .check { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
      .check input { margin: 0; accent-color: var(--accent); }
      label:has(input[type=range]:disabled) input[type=range] { opacity: .4; }
      .field { display: flex; flex-direction: column; gap: 4px; }
      .shapes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
      .shape { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 2px; font-size: 11px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--text); cursor: pointer; }
      .shape svg { width: 100%; height: 18px; }
      .shape path { fill: none; stroke: var(--muted); stroke-width: 1.5; }
      .shape[aria-pressed=true] { border-color: var(--accent); color: var(--accent); }
      .shape[aria-pressed=true] path { stroke: var(--accent); }
      .consequence { margin-top: -4px; }
      /* Панель параметров: группы-карточки, подзаголовки, воздух между полями. */
      #params .params-body { padding: 4px 14px 16px; gap: 10px; }
      #params details.param-group { border: 1px solid var(--line); border-radius: 10px; background: var(--raised); padding: 0; }
      #params details.param-group > summary { display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; column-gap: 8px; align-items: center; padding: 11px 14px; margin: 0; list-style: none; text-transform: none; letter-spacing: 0; color: var(--text); }
      #params details.param-group > summary::-webkit-details-marker { display: none; }
      #params details.param-group > summary::after { content: ''; grid-column: 2; grid-row: 1 / span 2; width: 7px; height: 7px; border-right: 1.6px solid var(--muted); border-bottom: 1.6px solid var(--muted); transform: rotate(-45deg); transition: transform 120ms; margin-right: 2px; }
      #params details.param-group[open] > summary::after { transform: rotate(45deg); }
      #params .group-title { font-size: 13.5px; font-weight: 600; }
      #params .group-about { grid-column: 1; font-size: 11.5px; color: var(--muted); font-weight: 400; }
      #params details.param-group[open] > summary { border-bottom: 1px solid var(--line); }
      #params details.param-group > .fields { padding: 14px 14px 16px; gap: 16px; }
      #params details.param-group.expert { background: transparent; border-style: dashed; }
      #params.live-laws .generator { display: none; }
      #params .subhead { font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); margin: 6px 0 -6px; }
      #params .subhead:first-child { margin-top: 0; }
      #params label, #params .field { gap: 7px; }
      /* Ничего не прыгает: подпись — одна строка, значение — плашка постоянной ширины, следствие — две строки. */
      #params label > .row, #params .field > .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; font-size: 12.5px; min-height: 20px; }
      #params label > .row > span:first-child, #params .field > .row > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #params .value { min-width: 11ch; text-align: center; font-variant-numeric: tabular-nums; }
      #params .slot { display: grid; }
      #params .slot > * { grid-area: 1 / 1; }
      #params .slot-off { visibility: hidden; }
      #params .value { padding: 2px 7px; border-radius: 999px; background: var(--bg); color: var(--text); font-size: 11px; white-space: nowrap; }
      #params .changed .value { background: var(--accent-soft); color: var(--accent); }
      #params .consequence { margin-top: -6px; padding: 7px 10px; border-radius: 7px; background: var(--bg); color: var(--muted); font-size: 11.5px; line-height: 1.45; min-height: calc(2 * 1.45em + 14px); display: flex; align-items: center; }
      #params .consequence:empty { display: none; }
      #params .check { font-size: 11.5px; margin-top: -2px; }
      #params .expert-note { font-size: 11.5px; color: var(--muted); line-height: 1.45; }
      #params .layout .row { color: var(--muted); }
      /* Тонкие ползунки — как у скорости мира. */
      #params input[type=range] { -webkit-appearance: none; appearance: none; height: 16px; background: transparent; }
      #params input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: var(--line-strong); }
      #params input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5.5px; border-radius: 50%; background: var(--raised); border: 2px solid var(--accent); box-shadow: 0 1px 3px #2a292526; }
      #params input[type=range]::-moz-range-track { height: 3px; border-radius: 2px; background: var(--line-strong); }
      #params input[type=range]::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: var(--raised); border: 2px solid var(--accent); }
      #params input[type=range]:disabled::-webkit-slider-thumb { border-color: var(--faint); }
      #params .dual input + input::-webkit-slider-runnable-track { background: transparent; }
      #params .params-foot { padding: 12px 14px 14px; gap: 10px; }
      #params .params-foot .primary { height: 34px; font-size: 13px; border-radius: 8px; }

      /* Предупреждение перед новым миром и метка черновика над чашей. */
      dialog.confirm { max-width: 380px; border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; background: var(--panel); color: var(--text); box-shadow: 0 12px 32px #2a292540; }
      dialog.confirm::backdrop { background: #2a292533; }
      dialog.confirm h3 { margin: 0 0 6px; font-size: 15px; }
      dialog.confirm p { margin: 0 0 14px; font-size: 13px; line-height: 1.45; color: var(--muted); }
      dialog.confirm .row { gap: 8px; }
      .draft-banner { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 5; padding: 6px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--accent); color: var(--accent); font-size: 12px; box-shadow: 0 4px 12px #2a292530; pointer-events: none; white-space: nowrap; }

      /* Полный экран: мир от края до края. Метка времени видна всегда; управление
         проявляется по движению мыши; панель — у правого края по требованию. */
      .immersive-time, .immersive-top { display: none; }
      .app.focus-mode #toolbar, .app.focus-mode .mineral-stats, .app.focus-mode .status { display: none; }
      .app.focus-mode .app-body, .app.focus-mode.sidebar-collapsed .app-body { grid-template-columns: minmax(0, 1fr); padding: 0; gap: 0; }
      .app.focus-mode .map-column { position: relative; gap: 0; }
      .app.focus-mode .stage { border-radius: 0; box-shadow: none; background: #13151700; }
      .app.focus-mode, .app.focus-mode .app-body { background: rgb(19, 21, 23); }
      .app.focus-mode { min-width: 0; }
      /* Плашки поверх мира — прозрачные: светлый текст с тенью, тонкие светлые кромки у кнопок. */
      .app.focus-mode .world-footer { position: absolute; z-index: 8; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(620px, calc(100% - 32px)); padding: 0 4px; background: transparent; transition: opacity .35s; }
      .app.focus-mode .world-playback { height: 44px; }
      .app.focus-mode .world-footer, .app.focus-mode .immersive-time { color: #eef0ee; text-shadow: 0 1px 3px #000c, 0 0 1px #000; }
      .app.focus-mode .world-footer *, .app.focus-mode .immersive-top button { color: #eef0ee; }
      .app.focus-mode .world-footer button, .app.focus-mode .immersive-top button { background: #ffffff10; border-color: #ffffff38; }
      .app.focus-mode .world-footer button:hover:not(:disabled), .app.focus-mode .immersive-top button:hover:not(:disabled) { background: #ffffff26; border-color: #ffffff66; }
      .app.focus-mode .world-footer .run-toggle[data-state=running] { background: #ffffff1f; border-color: #ffffff55; }
      .app.focus-mode .world-footer button svg, .app.focus-mode .immersive-top button svg { filter: drop-shadow(0 1px 2px #000a); }
      .app.focus-mode .world-footer .speed-ticks button, .app.focus-mode .world-footer .speed-ticks button:hover:not(:disabled) { background: transparent; border: 0; color: #eef0eebb; }
      .app.focus-mode .world-footer .speed-value { color: #ffc08a; }
      .app.focus-mode .immersive-top button[aria-pressed=true] { background: #ffffff26; border-color: #ffffff66; }
      .app.focus-mode .immersive-time { display: block; position: absolute; z-index: 5; top: 12px; left: 14px; font: 600 12px var(--mono); font-variant-numeric: tabular-nums; pointer-events: none; }
      .app.focus-mode .immersive-top { display: flex; gap: 6px; position: absolute; z-index: 8; top: 10px; right: 10px; transition: opacity .35s; }
      .app.focus-mode.idle .world-footer, .app.focus-mode.idle .immersive-top { opacity: 0; pointer-events: none; }
      .app.focus-mode.idle, .app.focus-mode.idle canvas { cursor: none; }
      .app.focus-mode .right-panel { position: absolute; z-index: 9; top: 52px; right: 10px; bottom: 84px; width: min(380px, calc(100% - 20px)); background: #f4f2ecf2; box-shadow: 0 10px 32px #2a292540; transition: transform .25s ease, opacity .25s ease; }
      .app.focus-mode.sidebar-collapsed .right-panel { width: 40px; bottom: auto; }
      .app.focus-mode.sidebar-collapsed:not(.peek) .right-panel { transform: translateX(calc(100% + 16px)); opacity: 0; pointer-events: none; }

    </style>
  </head>
  <body>
    <div class="app">
      <header id="toolbar"></header>
      <div class="app-body"><div class="map-column">
      <div class="workspace">
        <main class="field"><div class="stage"><canvas id="world" aria-label="Карта мира"></canvas>

        </div></main>
      </div>
      <footer class="world-footer">
      <div class="mineral-stats" title="Где сейчас минерал мира. Сумма постоянна."></div>
      <div class="world-playback" role="toolbar" aria-label="Управление симуляцией"></div>
      <div class="control-staging" hidden>
        <div id="view-controls"></div>
        <div class="light-drift"><span class="light-speed" title="Средняя скорость пятен света"></span><span class="sun-rhythm" title="Ритм солнца: множитель силы солнца сейчас и куда он идёт"></span></div>
        <div class="probe-content"><div class="probe-actions"><button class="probe-point-release" type="button" disabled>Снять точку</button></div><span class="probe-pin-note">Клик по карте закрепит точку. Её значения продолжат обновляться.</span><div class="tip">Наведите курсор на чашку, чтобы увидеть значения.</div></div>
      </div></footer></div>
      <aside class="right-panel" aria-label="Панель мира">
        <div class="panel-content">
          <div class="pane-head"><h2 class="pane-title"></h2></div>
          <div id="world-summary" aria-label="Сводка мира"></div>
          <div id="params" hidden></div>
          <div id="probe-pane" hidden></div>
          <div id="observation" hidden aria-label="Наблюдение за миром"><section id="legend" aria-label="Легенда карты"></section></div>
        </div>
        <nav class="panel-tabs" role="tablist" aria-orientation="vertical" aria-label="Вкладки панели"></nav>
      </aside></div>
    </div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
