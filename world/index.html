<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Песочница мира</title>
    <style>
      :root { color-scheme: light; --bg: #f3f5f8; --panel: #ffffff; --border: #d0d7de; --text: #1f2328; --muted: #59636e; --accent: #0969da; --danger: #cf222e; --control: #f6f8fa; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 13px system-ui, sans-serif; }
      main { display: flex; gap: 16px; padding: 16px; align-items: flex-start; flex-wrap: wrap; }
      .stage { flex: 1 1 600px; min-width: 0; }
      canvas { display: block; width: 100%; height: auto; }
      #panel { flex: 0 0 300px; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 12px; max-height: calc(100vh - 32px); overflow-y: auto; }
      section { display: flex; flex-direction: column; gap: 6px; }
      h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
      label { display: flex; flex-direction: column; gap: 2px; }
      label.inline { flex-direction: row; align-items: center; gap: 6px; }
      .row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
      .value { color: var(--muted); font-variant-numeric: tabular-nums; }
      input[type=number], select { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 4px 6px; width: 100%; }
      input[type=range] { width: 100%; }
      button { background: var(--control); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; cursor: pointer; white-space: nowrap; }
      button:hover:not(:disabled) { border-color: var(--muted); }
      button:disabled { opacity: 0.5; cursor: default; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; padding: 6px; }
      button.active { border-color: var(--accent); color: var(--accent); background: #ddf4ff; }
      .speeds { justify-content: flex-start; flex-wrap: wrap; }
      .time { font-variant-numeric: tabular-nums; }
      .note { color: var(--muted); font-size: 12px; }
      .note:empty, .errors:empty { display: none; }
      .errors { color: var(--danger); font-size: 12px; }
      .probe { font-variant-numeric: tabular-nums; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
      @media (max-width: 700px) { main { padding: 8px; } #panel { flex-basis: 100%; max-height: none; } }
    </style>
  </head>
  <body>
    <main>
      <div class="stage"><canvas id="world"></canvas></div>
      <aside id="panel"></aside>
    </main>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
