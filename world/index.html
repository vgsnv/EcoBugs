<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Песочница мира</title>
    <style>
      :root { color-scheme: light; --bg: #f3f5f8; --panel: #ffffff; --border: #d0d7de; --text: #1f2328; --muted: #59636e; --accent: #0969da; --accent-soft: #ddf4ff; --danger: #cf222e; --control: #f6f8fa; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px system-ui, sans-serif; overflow: hidden; }

      /* Раскладка: слева управление, чашка и легенда; справа параметры нового мира. */
      .app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 320px; grid-template-rows: auto minmax(0, 1fr) auto; }
      #toolbar { grid-column: 1; grid-row: 1; }
      .stage { grid-column: 1; grid-row: 2; position: relative; display: flex; align-items: center; justify-content: center; margin: 0 16px; min-height: 0; overflow: hidden; }
      #legend { grid-column: 1; grid-row: 3; }
      #params { grid-column: 2; grid-row: 1 / 4; }
      canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
      .stage.dragging canvas { cursor: grabbing; }
      .zoom { font-variant-numeric: tabular-nums; min-width: 64px; }
      .minimap { position: absolute; right: 10px; bottom: 10px; width: 176px; height: 132px; border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 4px; box-shadow: 0 4px 12px rgba(31, 35, 40, 0.3); cursor: pointer; z-index: 1; }
      .minimap[hidden] { display: none; }
      .light-drift { position: absolute; left: 10px; top: 10px; display: flex; align-items: center; gap: 6px; padding: 3px 8px 3px 4px; background: rgba(255, 255, 255, 0.85); border: 1px solid var(--border); border-radius: 14px; font-size: 11.5px; color: var(--muted); z-index: 1; user-select: none; }
      .light-drift svg { width: 20px; height: 20px; }
      .mineral-stats { position: absolute; left: 10px; top: 42px; padding: 3px 9px; background: rgba(255, 255, 255, 0.85); border: 1px solid var(--border); border-radius: 14px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; z-index: 1; user-select: none; }
      .mineral-stats b { color: #8a4fd0; font-weight: 600; }
      .light-drift circle { fill: #fff; stroke: var(--border); }
      .light-drift path { fill: none; stroke: #c98a1c; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

      #toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 16px; }
      .group { display: inline-flex; }
      .group button { border-radius: 0; margin-left: -1px; }
      .group button:first-child { border-radius: 4px 0 0 4px; margin-left: 0; }
      .group button:last-child { border-radius: 0 4px 4px 0; }
      .time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 190px; }
      .spacer { flex: 1; }
      .status { font-size: 12px; color: var(--muted); max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .status.error { color: var(--danger); }

      #legend { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 10px 16px; color: var(--muted); font-size: 12px; }
      .legend-item { display: flex; align-items: center; gap: 6px; }
      .swatch { flex: 0 0 18px; height: 12px; border-radius: 3px; border: 1px solid var(--border); }

      /* Подсказка у курсора. */
      .tip { position: absolute; pointer-events: none; background: rgba(255, 255, 255, 0.96); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; box-shadow: 0 4px 12px rgba(31, 35, 40, 0.15); font-size: 12px; line-height: 1.45; font-variant-numeric: tabular-nums; white-space: nowrap; z-index: 2; }
      .tip b { font-weight: 600; }

      /* Параметры нового мира: прокручиваемые группы и закреплённый низ. */
      #params { background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
      .params-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 8px; }
      .params-head h2 { margin: 0; font-size: 14px; }
      .params-body { flex: 1; overflow-y: auto; padding: 0 14px 12px; display: flex; flex-direction: column; gap: 4px; }
      .params-foot { border-top: 1px solid var(--border); padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
      details { border-bottom: 1px solid var(--border); padding: 6px 0 10px; }
      details:last-child { border-bottom: 0; }
      summary { cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 600; padding: 4px 0; user-select: none; }
      details[open] summary { margin-bottom: 4px; }
      .fields { display: flex; flex-direction: column; gap: 10px; }
      label { display: flex; flex-direction: column; gap: 3px; }
      .row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
      .row.end { justify-content: flex-end; }
      .info { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--border); color: var(--muted); font-size: 10px; cursor: help; margin-left: 4px; }
      .info:hover, .info:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
      .info-tip { position: fixed; z-index: 20; max-width: 260px; padding: 6px 9px; background: #1f2328; color: #fff; border-radius: 6px; font-size: 12px; line-height: 1.4; pointer-events: none; box-shadow: 0 4px 12px rgba(31, 35, 40, 0.25); }
      .value { color: var(--muted); font-variant-numeric: tabular-nums; }
      .changed .value { color: var(--accent); font-weight: 600; }
      .layout { display: flex; flex-direction: column; gap: 4px; }
      .layout svg { width: 100%; max-width: 200px; height: auto; align-self: center; }
      .layout .dish { fill: #2f5ea8; stroke: #9fbfe0; stroke-width: 3; }
      .layout .wall { fill: none; stroke: #d6e6f5; stroke-width: 3; stroke-linecap: square; stroke-linejoin: miter; }
      .note { color: var(--muted); font-size: 12px; }
      .note:empty, .errors:empty { display: none; }
      .errors { color: var(--danger); font-size: 12px; }

      input[type=number], select { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 4px 6px; width: 100%; font: inherit; }
      input[type=range] { width: 100%; margin: 0; }
      button { background: var(--control); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 4px 9px; cursor: pointer; white-space: nowrap; font: inherit; }
      button:hover:not(:disabled) { border-color: var(--muted); position: relative; }
      button:disabled { opacity: 0.5; cursor: default; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; padding: 7px; font-weight: 600; }
      button.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); position: relative; }
      .params-toggle, .params-close { display: none; }
      #scrim { display: none; }

      /* Узкий экран: параметры — выдвижная панель по кнопке. */
      @media (max-width: 900px) {
        .app { grid-template-columns: minmax(0, 1fr); }
        .stage { margin: 0 8px; }
        #toolbar, #legend { padding-left: 8px; padding-right: 8px; }
        #params { position: fixed; top: 0; right: 0; bottom: 0; width: min(340px, 90vw); z-index: 10; transform: translateX(100%); transition: transform 0.2s; visibility: hidden; }
        .app.params-open #params { transform: none; visibility: visible; box-shadow: -8px 0 24px rgba(31, 35, 40, 0.2); }
        .app.params-open #scrim { display: block; position: fixed; inset: 0; background: rgba(31, 35, 40, 0.3); z-index: 9; }
        .params-toggle, .params-close { display: inline-block; }
        .time { min-width: 0; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header id="toolbar"></header>
      <div class="stage">
        <canvas id="world"></canvas>
        <div class="tip" hidden></div>
        <div class="light-drift" title="Куда сдвигается карта света. Сдвиг очень медленный — заметен на ускорении."><svg viewBox="-12 -12 24 24"><circle r="11" /><path d="M -6 0 H 6 M 2 -4 L 6 0 L 2 4" /></svg><span>дрейф света</span></div>
        <div class="mineral-stats" title="Где сейчас минерал мира. Сумма постоянна."></div>
        <canvas class="minimap" hidden title="Вся чашка. Клик — перейти сюда"></canvas>
      </div>
      <footer id="legend"></footer>
      <aside id="params"></aside>
      <div id="scrim"></div>
    </div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
