<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Песочница мира</title>
    <style>
      :root { color-scheme: light; --bg: #f3f5f8; --panel: #ffffff; --border: #d0d7de; --text: #1f2328; --muted: #59636e; --accent: #0969da; --accent-soft: #ddf4ff; --danger: #cf222e; --control: #f6f8fa; }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px system-ui, sans-serif; overflow: hidden; }

      /* Раскладка: слева управление, чашка и легенда; справа параметры нового мира. */
      .app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; }
      .app.params-open { grid-template-columns: minmax(0, 1fr) 320px; }
      #toolbar { grid-column: 1; grid-row: 1; }
      /* Поле: чашка в пропорциях чашки со стеной и сводка минерала сразу под ней, той же ширины. */
      .field { grid-column: 1; grid-row: 2; margin: 0 16px; min-height: 0; container-type: size; display: flex; align-items: center; justify-content: center; }
      .field-inner { width: 100%; height: 100%; display: flex; flex-direction: column; }
      .stage { position: relative; width: 100%; flex: 1; min-height: 0; overflow: hidden; }

      #params { grid-column: 2; grid-row: 1 / 4; }
      .app:not(.params-open) #params { display: none; }
      canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
      .stage.dragging canvas { cursor: grabbing; }
      .zoom { font-variant-numeric: tabular-nums; min-width: 64px; }
      .minimap { position: absolute; right: 10px; bottom: 10px; width: 176px; height: 132px; border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 4px; box-shadow: 0 4px 12px rgba(31, 35, 40, 0.3); cursor: pointer; z-index: 1; }
      .minimap[hidden] { display: none; }
      .light-drift { position: absolute; right: 10px; top: 10px; display: flex; align-items: center; gap: 6px; padding: 3px 8px 3px 4px; background: rgba(255, 255, 255, 0.85); border: 1px solid var(--border); border-radius: 14px; font-size: 11.5px; color: var(--muted); z-index: 1; user-select: none; }
      .light-drift svg { width: 20px; height: 20px; }
      .sun-rhythm { margin-left: 6px; padding-left: 8px; border-left: 1px solid var(--border); color: #a76d0d; font-variant-numeric: tabular-nums; }
      .mineral-stats b { color: #8a4fd0; font-weight: 600; }
      /* Под чашкой: полоса минерала во всю ширину (недра, «в пути» — выходит извержением, залежи, среда; риска — порог давления недр), подписи второй строкой. */
      .mineral-stats { flex-shrink: 0; margin-top: 8px; display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; user-select: none; }
      .mineral-keys { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 14px; }
      .mineral-keys .volcanoes { margin-left: auto; }
      .mineral-bar { position: relative; display: block; width: 100%; height: 18px; background: #ece6f5; border: 1px solid #cbbde3; overflow: hidden; cursor: help; }
      .mineral-bar i { position: absolute; top: 0; bottom: 0; transition: left 0.25s linear, width 0.25s linear; }
      .mineral-stats .depths { background: #3d2a5c; }
      .mineral-stats .out { background: #e2c8ff; animation: mineral-out 0.8s ease-in-out infinite alternate; }
      .mineral-stats .medium { background: #b783f5; }
      /* Залежи — с фактурой: косая штриховка и светлые крупинки, как кристаллы на дне. */
      .mineral-stats .deposits { background-color: #6a3fa6; background-image: radial-gradient(circle at 2px 2px, rgba(255, 240, 255, 0.85) 0.9px, transparent 1.4px), repeating-linear-gradient(135deg, rgba(30, 10, 60, 0.45) 0 2px, transparent 2px 5px); background-size: 6px 6px, auto; }
      .mineral-bar .threshold { width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 0 1px #d23c7a; }
      @keyframes mineral-out { from { opacity: 1; } to { opacity: 0.45; } }
      .key { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
      .key i { display: inline-block; width: 12px; height: 12px; }
      .light-drift circle { fill: #fff; stroke: var(--border); }
      .light-drift path { fill: none; stroke: #c98a1c; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

      #toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 16px; }
      .group { display: inline-flex; border-radius: 8px; }
      .group button { border-radius: 0; margin-left: -1px; }
      .group button:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
      .group button:last-child { border-radius: 0 8px 8px 0; }
      .time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 190px; }
      .speed-control { flex-direction: row; align-items: center; gap: 6px; color: var(--muted); }
      .speed-select { width: auto; max-width: 180px; min-height: 36px; border-color: #c5d1df; border-radius: 8px; padding: 6px 10px; }
      #toolbar > .group:first-child button:first-child { background: var(--accent); color: white; border-color: var(--accent); min-width: 90px; font-weight: 600; }
      .spacer { flex: 1; }
      .status { font-size: 12px; color: var(--muted); max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .status.error { color: var(--danger); }

      .legend-toggle { position: absolute; left: 10px; top: 10px; z-index: 3; }
      #legend { position: absolute; left: 10px; top: 54px; bottom: 10px; width: min(260px, calc(100% - 20px)); z-index: 3; display: flex; flex-direction: column; background: #fff; border: 1px solid #c5d1df; border-radius: 12px; box-shadow: 0 8px 28px rgba(31, 51, 76, 0.15); overflow: hidden; font-size: 12px; }
      .legend-head { display: flex; flex-shrink: 0; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid #e5ebf2; }
      .legend-head h2 { margin: 0; font-size: 14px; }
      .legend-body { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 18px; }
      .legend-section h3 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
      .legend-items { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      button.legend-item { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; white-space: normal; font-size: 12px; font-weight: 400; border-color: transparent; background: #f5f8fc; padding: 8px; }
      button.legend-item[aria-pressed=true] { background: #e8f2ff; border-color: #7fa9da; }
      .swatch { display: flex; align-items: center; justify-content: center; width: 28px; height: 24px; border-radius: 5px; border: 1px solid rgba(92, 117, 149, .25); font-size: 22px; line-height: 1; }
      .legend-item svg { width: 26px; height: 22px; }
      .legend-detail { flex-shrink: 0; max-height: 110px; overflow-y: auto; padding: 10px 12px; border-top: 1px solid #e5ebf2; color: var(--muted); line-height: 1.5; background: #f5f8fc; }
      .legend-extras { padding-bottom: 0; }
      .legend-extras summary { text-transform: none; letter-spacing: 0; }
      .process-control { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; }
      .process-legend { display: flex; flex-wrap: wrap; gap: 10px; padding: 7px 10px; border: 1px solid #c5d1df; border-radius: 8px; background: #fff; font-size: 11px; white-space: nowrap; }
      .process-legend span { color: #30445b; }
      .process-legend i { font-style: normal; font-weight: 700; margin-right: 4px; }

      /* Подсказка у курсора. */
      .tip { position: absolute; pointer-events: none; background: rgba(255, 255, 255, 0.96); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; box-shadow: 0 4px 12px rgba(31, 35, 40, 0.15); font-size: 12px; line-height: 1.45; font-variant-numeric: tabular-nums; white-space: nowrap; z-index: 2; }
      .tip b { font-weight: 600; }

      /* Параметры нового мира: прокручиваемые группы и закреплённый низ. */
      #params { background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
      .params-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 8px; }
      .params-head h2 { margin: 0; font-size: 14px; }
      .params-body { flex: 1; overflow-y: auto; padding: 0 14px 12px; display: flex; flex-direction: column; gap: 4px; }
      .params-foot { border-top: 1px solid var(--border); padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
      details { border-bottom: 1px solid var(--border); padding: 6px 0 10px; }
      details:last-child { border-bottom: 0; }
      summary { cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 600; padding: 4px 0; user-select: none; }
      details[open] summary { margin-bottom: 4px; }
      .fields { display: flex; flex-direction: column; gap: 10px; }
      label { display: flex; flex-direction: column; gap: 3px; }
      .row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
      .row.end { justify-content: flex-end; }
      .info { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--border); color: var(--muted); font-size: 10px; cursor: help; margin-left: 4px; }
      .info:hover, .info:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
      .info-tip { position: fixed; z-index: 20; max-width: 260px; padding: 6px 9px; background: #1f2328; color: #fff; border-radius: 6px; font-size: 12px; line-height: 1.4; pointer-events: none; box-shadow: 0 4px 12px rgba(31, 35, 40, 0.25); }
      .value { color: var(--muted); font-variant-numeric: tabular-nums; }
      .changed .value { color: var(--accent); font-weight: 600; }
      .layout { display: flex; flex-direction: column; gap: 4px; }
      .layout svg { width: 100%; max-width: 200px; max-height: 180px; height: auto; align-self: center; }
      .layout .dish { fill: #2f5ea8; stroke: #9fbfe0; stroke-width: 3; }
      .layout .wall { fill: none; stroke: #d6e6f5; stroke-width: 3; stroke-linecap: square; stroke-linejoin: miter; }
      .note { color: var(--muted); font-size: 12px; }
      .note:empty, .errors:empty { display: none; }
      .errors { color: var(--danger); font-size: 12px; }

      input[type=number], select { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 4px 6px; width: 100%; font: inherit; }
      input[type=range] { width: 100%; margin: 0; }
      button { background: #fff; color: #30445b; border: 1px solid #c5d1df; border-radius: 8px; padding: 7px 12px; min-height: 36px; cursor: pointer; white-space: nowrap; font: inherit; font-weight: 500; transition: background-color 120ms, border-color 120ms, color 120ms; }
      button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      button[aria-pressed=true], button[aria-expanded=true] { border-color: #7fa9da; color: #145ba8; background: #e8f2ff; }
      button:hover:not(:disabled) { background: #f0f5fb; border-color: #91a9c4; }
      .group button:hover:not(:disabled) { position: relative; }
      button:active:not(:disabled) { background: #dce9f8; }
      button:disabled { background: #f3f5f8; color: #8995a4; border-color: #dbe2eb; opacity: 1; cursor: default; }
      #toolbar > .group:first-child button:first-child:hover, button.primary:hover:not(:disabled) { background: #075bb9; border-color: #075bb9; }
      #toolbar > .group:first-child button:first-child:active, button.primary:active:not(:disabled) { background: #064b98; border-color: #064b98; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; padding: 7px; font-weight: 600; }
      button.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); position: relative; }
      .params-toggle, .params-close { display: inline-block; }
      .app.focus-mode #legend, .app.focus-mode .legend-toggle, .app.focus-mode .mineral-stats, .app.focus-mode .light-drift { display: none; }
      #scrim { display: none; }

      /* Узкий экран: параметры — выдвижная панель по кнопке. */
      @media (max-width: 900px) {
        .app, .app.params-open { grid-template-columns: minmax(0, 1fr); }
        .field { margin: 0 8px; }
        #toolbar { padding-left: 8px; padding-right: 8px; }
        #params { position: fixed; top: 0; right: 0; bottom: 0; width: min(340px, 90vw); z-index: 10; transform: translateX(100%); transition: transform 0.2s; visibility: hidden; }
        .app.params-open #params { transform: none; visibility: visible; box-shadow: -8px 0 24px rgba(31, 35, 40, 0.2); }
        .app.params-open #scrim { display: block; position: fixed; inset: 0; background: rgba(31, 35, 40, 0.3); z-index: 9; }
        .params-toggle, .params-close { display: inline-block; }
        .time { min-width: 0; }
      }
      @media (max-width: 600px) {
        #toolbar { gap: 6px; padding-top: 8px; padding-bottom: 8px; }
        .time { order: 1; flex-basis: 100%; font-size: 12px; }
        .status { order: 2; flex-basis: 100%; }
        .status:empty { display: none; }
        .speed-control > span { display: none; }
        .speed-select { max-width: 155px; min-height: 36px; }
        button { min-height: 36px; }
        .minimap { width: 128px; height: 96px; }
        .light-drift { top: 54px; font-size: 10px; }
        .process-legend { left: 0; gap: 6px; font-size: 10px; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header id="toolbar"></header>
      <div class="field"><div class="field-inner">
      <div class="stage">
        <canvas id="world"></canvas>
        <div class="tip" hidden></div>
        <div class="light-drift" title="Куда сдвигается карта света. Сдвиг очень медленный — заметен на ускорении."><svg viewBox="-12 -12 24 24"><circle r="11" /><path d="M -6 0 H 6 M 2 -4 L 6 0 L 2 4" /></svg><span>дрейф света</span><span class="sun-rhythm" title="Ритм солнца: множитель силы солнца сейчас и куда он идёт. Ярче — больше энергии и сильнее течения."></span></div>
        <canvas class="minimap" hidden title="Вся чашка. Клик — перейти сюда"></canvas>
        <aside id="legend" hidden aria-label="Легенда карты"></aside>
      </div>
      <div class="mineral-stats" title="Где сейчас минерал мира. Сумма постоянна."></div>
      </div></div>

      <aside id="params"></aside>
      <div id="scrim"></div>
    </div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
